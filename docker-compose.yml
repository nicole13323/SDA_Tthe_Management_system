services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tithe
      POSTGRES_USER: tithe
      POSTGRES_PASSWORD: tithe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tithe -d tithe"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tithe
      DB_USER: tithe
      DB_PASSWORD: tithe
      MONGO_URI: mongodb://mongo:27017/tithe
      RABBIT_HOST: rabbitmq
      JWT_SECRET: please-change-this-to-a-long-random-secret-value-123456
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  mongodata:
