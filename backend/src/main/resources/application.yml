server:
  port: 8080

spring:
  application:
    name: sda-tithe-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tithe}
    username: ${DB_USER:tithe}
    password: ${DB_PASSWORD:tithe}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/tithe}
      auto-index-creation: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-at-least-32-characters-long}
    ttl-minutes: 120
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed: ${SEED_DEMO_DATA:true}
